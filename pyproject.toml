[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transform-xml"
version = "0.1.0"
description = "A Python package to transform XML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
transform-xml = "transform_xml.main:main"

[tool.setuptools.packages.find]
where = ["src"]
